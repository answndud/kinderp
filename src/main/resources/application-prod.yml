# ===========================================
# 운영 환경 설정
# ===========================================

spring:
  lifecycle:
    timeout-per-shutdown-phase: 25s
  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
  # MySQL 설정 (운영)
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 30000

  # JPA 설정 (운영)
  jpa:
    hibernate:
      ddl-auto: none  # 운영에서는 절대 auto 금지
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # Redis 설정 (운영)
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

  # Flyway 설정 (운영)
  flyway:
    enabled: true
    clean-disabled: true  # 운영에서는 clean 절대 금지

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
            provider: kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  cookie-secure: true

server:
  shutdown: graceful

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9091}
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

app:
  seed:
    enabled: ${APP_SEED_ENABLED:false}
    log-credentials: false
  security:
    management-surface:
      public-api-docs: false
      expose-prometheus-on-app-port: false
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
    client-ip:
      trusted-proxies:
        - 172.28.0.0/16

notification:
  delivery:
    email:
      enabled: ${NOTIFICATION_EMAIL_ENABLED:true}
      from: ${NOTIFICATION_EMAIL_FROM}
      subject-prefix: "[KinderCare]"
    push:
      signature-secret: ${NOTIFICATION_PUSH_WEBHOOK_SECRET:}
    app:
      signature-secret: ${NOTIFICATION_APP_WEBHOOK_SECRET:}
    incident-webhook:
      signature-secret: ${NOTIFICATION_INCIDENT_WEBHOOK_SECRET:}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 로깅 설정 (운영 - 최소화)
logging:
  level:
    root: WARN
    com.kinderp: INFO
    org.hibernate.SQL: WARN

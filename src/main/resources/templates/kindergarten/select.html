<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유치원 선택 - 유치원 ERP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}" href="/css/custom.css">
</head>
<body class="bg-gray-50">
<header class="bg-white border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <a href="/" class="flex items-center gap-2">
                <div class="w-10 h-10 bg-emerald-700 rounded-xl flex items-center justify-center">
                    <img th:src="@{/img/logo.svg}" src="/img/logo.svg" alt="KinderCare" class="w-full h-full object-contain" />
                </div>
                <span class="sr-only">KinderCare</span>
            </a>
        </div>
    </div>
</header>

<main id="kindergarten-select-page" class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10">
    <div class="mb-6">
        <p class="text-sm font-semibold text-primary-700">교사 지원</p>
        <h1 class="mt-2 text-3xl font-bold text-gray-900">유치원 선택</h1>
        <p class="mt-2 max-w-2xl text-gray-600">지원할 유치원을 선택하면 원장 승인 후 업무 화면을 사용할 수 있습니다.</p>
    </div>

    <div id="kindergartenList" class="space-y-3" role="region" aria-label="유치원 목록" aria-live="polite" aria-busy="true">
        <p class="rounded-xl border border-gray-200 bg-white px-5 py-8 text-center text-sm text-gray-500">유치원 목록을 불러오는 중입니다.</p>
    </div>
</main>

<script th:attr="nonce=${cspNonce}" src="/vendor/sweetalert2.all.min.js"></script>
<script th:attr="nonce=${cspNonce}" th:src="@{/js/app.js}" src="/js/app.js"></script>
<script th:attr="nonce=${cspNonce}" th:src="@{/js/pages/kindergarten-select.js}" src="/js/pages/kindergarten-select.js"></script>
</body>
</html>

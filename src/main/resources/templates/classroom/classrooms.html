<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반 관리 - 유치원 ERP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}" href="/css/custom.css">
</head>
<body class="bg-gray-50">
<header th:replace="~{fragments/header :: header}"></header>

<main id="classrooms-page" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8"
      th:attr="data-kindergarten-id=${currentMember?.kindergartenId}">
    <div class="mb-7">
        <p class="mb-2 text-sm font-semibold text-primary-700">Classroom Directory</p>
        <h1 class="text-3xl font-bold text-gray-900">반 관리</h1>
        <p class="mt-3 max-w-3xl text-gray-600">
            <span th:if="${currentMember?.kindergartenName != null}">
                <span class="font-semibold text-gray-800" th:text="${currentMember.kindergartenName}">유치원</span>의 반과 담임 배정 상태를 확인합니다.
            </span>
            <span th:if="${currentMember?.kindergartenName == null}">소속 유치원이 없습니다. 먼저 승인/배정을 완료하세요.</span>
        </p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <section class="bg-white rounded-xl border border-gray-200 p-5 sm:p-6">
            <div class="mb-5">
                <h2 class="text-xl font-bold text-gray-900">반 생성</h2>
                <p class="mt-1 text-sm text-gray-600">운영 중인 반 이름과 연령대를 등록합니다.</p>
            </div>
            <form id="classroom-form" class="space-y-4">
                <div>
                    <label for="classroom-name" class="block text-sm font-medium text-gray-700 mb-1.5">반 이름 *</label>
                    <input id="classroom-name" required autocomplete="organization-title"
                           class="h-11 w-full rounded-lg border border-gray-200 px-4 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500"
                           placeholder="예) 해바라기반" />
                </div>
                <div>
                    <label for="classroom-age" class="block text-sm font-medium text-gray-700 mb-1.5">연령대</label>
                    <input id="classroom-age" autocomplete="off"
                           class="h-11 w-full rounded-lg border border-gray-200 px-4 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500"
                           placeholder="예) 5세" />
                </div>
                <div class="flex justify-end pt-2">
                    <button type="submit" id="createClassroomSubmit" class="min-h-11 w-full rounded-lg bg-primary-600 px-5 py-2.5 font-semibold text-white transition-colors hover:bg-primary-700 disabled:cursor-not-allowed disabled:opacity-50 sm:w-auto">
                        반 생성
                    </button>
                </div>
            </form>
            <p id="classroomStatus" class="mt-4 text-sm text-gray-600" role="status" aria-live="polite" aria-atomic="true" th:if="${currentMember?.kindergartenId == null}">
                반을 생성하려면 먼저 소속 유치원이 필요합니다.
            </p>
        </section>

        <section class="bg-white rounded-xl border border-gray-200 p-5 sm:p-6">
            <div class="flex items-center justify-between mb-4">
                <div>
                    <h2 class="text-xl font-bold text-gray-900">반 목록</h2>
                    <p class="mt-1 text-sm text-gray-600">담임 배정 여부를 함께 확인합니다.</p>
                </div>
                <button type="button" class="min-h-11 rounded-lg border border-gray-200 px-4 text-sm font-semibold text-gray-700 transition-colors hover:bg-gray-50" data-action="loadClassrooms">새로고침</button>
            </div>
            <div id="classroom-list" class="divide-y divide-gray-100" role="region" aria-label="반 목록" aria-live="polite" aria-busy="true">
                <div class="text-center py-8 text-gray-500">불러오는 중...</div>
            </div>
        </section>
    </div>
</main>

<script th:attr="nonce=${cspNonce}" src="/vendor/htmx.min.js"></script>
<script th:attr="nonce=${cspNonce}" defer src="/vendor/alpine.min.js"></script>
<script th:attr="nonce=${cspNonce}" src="/vendor/sweetalert2.all.min.js"></script>
<script th:attr="nonce=${cspNonce}" th:src="@{/js/app.js}" src="/js/app.js"></script>
<script th:attr="nonce=${cspNonce}" th:src="@{/js/pages/classrooms.js}" src="/js/pages/classrooms.js"></script>
</body>
</html>

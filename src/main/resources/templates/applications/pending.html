<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지원/승인 - 유치원 ERP</title>

    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}" href="/css/custom.css">
</head>
<body class="bg-gray-50">

<header th:replace="~{fragments/header :: header}"></header>

    <main id="applications-page" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8"
      th:attr="data-kindergarten-id=${currentMember?.kindergartenId},data-role=${currentMember?.role?.name()},data-status=${currentMember?.status?.name()}">
    <div class="mb-6">
        <p class="text-sm font-semibold text-primary-700">Application Queue</p>
        <h1 class="mt-2 text-2xl font-bold text-gray-900">지원/승인</h1>
        <p class="mt-2 max-w-2xl text-gray-600">소속 신청과 입학 신청의 현재 상태, 다음 처리 액션을 확인하세요.</p>
    </div>

    <div id="pending-content"
         hx-get="/applications/pending/content"
         hx-trigger="load"
         hx-swap="outerHTML"
         role="status"
         aria-live="polite"
         aria-busy="true">
        <div class="flex items-center gap-3 rounded-xl border border-gray-200 bg-white px-5 py-6 text-sm text-gray-600">
            <svg class="h-5 w-5 animate-spin text-primary-600" fill="none" viewBox="0 0 24 24" aria-hidden="true">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            신청 상태를 불러오는 중입니다.
        </div>
    </div>
</main>

<!-- HTMX -->
<script th:attr="nonce=${cspNonce}" src="/vendor/htmx.min.js"></script>

<!-- Alpine.js -->
<script th:attr="nonce=${cspNonce}" defer src="/vendor/alpine.min.js"></script>

<!-- SweetAlert2 -->
<script th:attr="nonce=${cspNonce}" src="/vendor/sweetalert2.all.min.js"></script>

<!-- Custom JS (UI/Notifications) -->
<script th:attr="nonce=${cspNonce}" th:src="@{/js/app.js}"></script>

<script th:attr="nonce=${cspNonce}" src="/js/pages/applications.js"></script>
</body>
</html>

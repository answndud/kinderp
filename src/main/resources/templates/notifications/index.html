<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알림 센터 - 유치원 ERP</title>

    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}" href="/css/custom.css">
</head>
<body class="bg-gray-50">

<header th:replace="~{fragments/header :: header}"></header>

<main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
    <div class="mb-7 flex flex-col gap-2">
        <p class="text-sm font-semibold text-primary-700">Notification Center</p>
        <h1 class="text-3xl font-bold text-gray-900">알림 센터</h1>
        <p class="text-gray-600">최근 알림을 유형별로 확인하고 필요한 항목만 빠르게 처리하세요.</p>
    </div>

    <div id="notification-center-list"
         hx-get="/notifications/fragments/list?limit=50&unreadOnly=false&showFilters=true"
         hx-trigger="load"
         hx-swap="outerHTML">
        <div class="bg-white border border-gray-200 rounded-xl p-6 text-sm text-gray-500">알림을 불러오는 중입니다.</div>
    </div>
</main>

<script th:attr="nonce=${cspNonce}" src="/vendor/htmx.min.js"></script>
<script th:attr="nonce=${cspNonce}" src="/vendor/sweetalert2.all.min.js"></script>
<script th:attr="nonce=${cspNonce}" th:src="@{/js/app.js}"></script>
</body>
</html>

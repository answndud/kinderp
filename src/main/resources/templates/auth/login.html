<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 유치원 ERP</title>

    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}" href="/css/custom.css">
</head>
<body class="auth-screen bg-gray-50 min-h-screen flex items-center justify-center p-4 sm:p-6"
      x-data="loginForm">

    <!-- Login Container -->
    <div class="auth-shell auth-shell-login w-full max-w-xl">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center gap-3 mb-4">
                <div class="w-12 h-12 rounded-lg border border-gray-200 bg-white flex items-center justify-center">
                    <img th:src="@{/img/logo.svg}" src="/img/logo.svg" alt="KinderCare" class="w-full h-full object-contain" />
                </div>
                <span class="sr-only">KinderCare</span>
            </div>
            <p class="text-sm font-semibold text-primary-700">KinderCare ERP</p>
            <h1 class="mt-2 text-3xl font-bold text-gray-900">로그인</h1>
            <p class="mt-3 text-gray-600">업무 계정으로 접속해 오늘의 운영 상태를 확인하세요.</p>
        </div>

        <!-- Login Card -->
        <div class="auth-card bg-white rounded-xl border border-gray-200 p-6 sm:p-8">
            <!-- Error Alert -->
            <div x-show="error" x-cloak role="alert"
                 class="mb-6 p-4 bg-red-50 border border-red-200 rounded-xl">
                <div class="flex items-center gap-3">
                    <svg class="w-5 h-5 text-red-500 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                    </svg>
                    <span class="text-sm text-red-600" x-text="error"></span>
                </div>
            </div>

            <div th:if="${loginErrorMessage}" class="mb-6 p-4 bg-amber-50 border border-amber-200 rounded-xl">
                <div class="flex items-center gap-3">
                    <svg class="w-5 h-5 text-amber-500 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.981-1.742 2.981H4.419c-1.53 0-2.492-1.647-1.743-2.98l5.58-9.921zM11 13a1 1 0 10-2 0 1 1 0 002 0zm-1-7a1 1 0 00-1 1v3a1 1 0 102 0V7a1 1 0 00-1-1z" clip-rule="evenodd"/>
                    </svg>
                    <div class="space-y-1">
                        <p class="text-sm font-semibold text-amber-800" th:text="${loginErrorTitle}">소셜 로그인 안내</p>
                        <p class="text-sm text-amber-700" th:text="${loginErrorMessage}">소셜 로그인에 실패했습니다. 잠시 후 다시 시도해주세요.</p>
                        <p th:if="${loginErrorHint != null}" class="text-xs text-amber-700/90" th:text="${loginErrorHint}">잠시 후 다시 시도해 주세요.</p>
                    </div>
                </div>
            </div>

            <form @submit.prevent="handleSubmit">
                <!-- Email -->
                <div class="mb-4">
                    <label for="email" class="block mb-1.5 text-sm font-medium text-gray-700">이메일 주소</label>
                    <input type="email" id="email" name="email" autocomplete="email" required
                           x-model="email"
                           class="py-3 px-4 block w-full border border-gray-200 rounded-xl text-sm focus:border-primary-500 focus:ring-primary-500 disabled:opacity-50 disabled:pointer-events-none"
                           placeholder="example@email.com">
                </div>

                <!-- Password -->
                <div class="mb-5">
                    <div class="flex items-center justify-between gap-3 mb-1.5">
                        <label for="password" class="text-sm font-medium text-gray-700">비밀번호</label>
                        <span class="text-sm text-gray-500">8자 이상</span>
                    </div>
                    <div class="relative">
                        <input :type="showPassword ? 'text' : 'password'" id="password" name="password" autocomplete="current-password" required
                               x-model="password"
                               class="py-3 px-4 pr-12 block w-full border border-gray-200 rounded-xl text-sm focus:border-primary-500 focus:ring-primary-500 disabled:opacity-50 disabled:pointer-events-none"
                               placeholder="••••••••">
                        <button type="button" @click="showPassword = !showPassword"
                                class="absolute inset-y-0 right-0 inline-flex min-w-11 items-center justify-center text-gray-400 hover:text-gray-600"
                                :aria-label="showPassword ? '비밀번호 숨기기' : '비밀번호 보기'">
                            <svg x-show="!showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                            <svg x-show="showPassword" x-cloak class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" :disabled="isLoading || !email || !password"
                        class="w-full min-h-11 px-4 inline-flex justify-center items-center gap-x-2 text-sm font-semibold rounded-lg border border-transparent bg-primary-600 text-white hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed transition-all">
                    <span x-show="!isLoading">로그인</span>
                    <span x-show="isLoading" x-cloak class="flex items-center gap-2">
                        <svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        로그인 중...
                    </span>
                </button>
            </form>

            <!-- Divider -->
            <div class="flex items-center gap-4 my-6">
                <div class="flex-1 h-px bg-gray-200"></div>
                <span class="text-sm text-gray-500">또는</span>
                <div class="flex-1 h-px bg-gray-200"></div>
            </div>

            <!-- Social Login -->
            <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
                <a href="/oauth2/authorization/google" class="min-h-11 px-4 inline-flex justify-center items-center gap-2 rounded-lg border border-gray-200 bg-white text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 transition-all text-sm font-medium">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Google
                </a>
                <a href="/oauth2/authorization/kakao" class="min-h-11 px-4 inline-flex justify-center items-center gap-2 rounded-lg border border-gray-200 bg-white text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 transition-all text-sm font-medium">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#F5E049" d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>
                    </svg>
                    Kakao
                </a>
            </div>

            <!-- Sign Up Link -->
            <div class="mt-6 text-center text-sm text-gray-600">
                계정이 없으신가요?
                <a href="/signup" class="inline-flex min-h-8 items-center font-medium text-primary-700 hover:text-primary-800">회원가입</a>
            </div>
        </div>

        <!-- Footer -->
        <p class="mt-8 text-center text-sm text-gray-500">
            © 2026 유치원 ERP. All rights reserved.
        </p>
    </div>

    <!-- HTMX -->
    <script th:attr="nonce=${cspNonce}" src="/vendor/htmx.min.js"></script>

    <!-- Alpine.js -->
    <script th:attr="nonce=${cspNonce}" defer src="/vendor/alpine.min.js"></script>

    <!-- Custom JS (CSRF, UI helpers) -->
    <script th:attr="nonce=${cspNonce}" th:src="@{/js/app.js}"></script>

    <script th:attr="nonce=${cspNonce}" th:src="@{/js/pages/auth-forms.js}" src="/js/pages/auth-forms.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>원생 관리 - 유치원 ERP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}" href="/css/custom.css">
</head>
<body class="bg-gray-50">

<header th:replace="~{fragments/header :: header}"></header>

<main id="kids-page" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8"
      th:attr="data-kindergarten-id=${currentMember?.kindergartenId},data-role=${currentMember?.role?.name()}">
    <div class="mb-7">
        <p class="mb-2 text-sm font-semibold text-primary-700">원생 목록</p>
        <h1 class="text-3xl font-bold text-gray-900">원생 관리</h1>
        <p class="mt-3 max-w-3xl text-gray-600">
            <span th:if="${currentMember?.kindergartenName != null}">
                <span class="font-semibold text-gray-800" th:text="${currentMember.kindergartenName}">유치원</span>의 원생, 반 배정, 보호자 연결을 확인합니다.
            </span>
            <span th:if="${currentMember?.kindergartenName == null}">소속 유치원이 없습니다. 먼저 승인/배정을 완료하세요.</span>
        </p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <section class="bg-white rounded-xl border border-gray-200 p-5 sm:p-6">
            <div class="mb-5">
                <h2 class="text-xl font-bold text-gray-900">원생 검색</h2>
                <p class="mt-1 text-sm text-gray-600">반, 이름, 정렬 기준으로 목록을 좁힙니다.</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label for="classroom-filter" class="block text-sm font-medium text-gray-700 mb-1.5">반</label>
                    <select id="classroom-filter"
                            class="h-11 w-full rounded-lg border border-gray-200 px-4 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
                        <option value="">전체</option>
                    </select>
                </div>
                <div>
                    <label for="name-filter" class="block text-sm font-medium text-gray-700 mb-1.5">이름</label>
                    <input id="name-filter"
                           class="h-11 w-full rounded-lg border border-gray-200 px-4 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500"
                           placeholder="이름 검색"
                           data-key-action="loadKids" data-page="1" />
                </div>
                <div>
                    <label for="sort-filter" class="block text-sm font-medium text-gray-700 mb-1.5">정렬</label>
                    <select id="sort-filter"
                            class="h-11 w-full rounded-lg border border-gray-200 px-4 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
                        <option value="name">이름순</option>
                        <option value="age">나이순</option>
                        <option value="recent">최근 등록순</option>
                    </select>
                </div>
                <div class="flex flex-col gap-2 sm:flex-row lg:flex-col xl:flex-row">
                    <button type="button" data-action="loadKids" data-page="1" class="min-h-11 flex-1 rounded-lg bg-primary-600 px-5 py-2.5 font-semibold text-white transition-colors hover:bg-primary-700">
                        검색
                    </button>
                    <button type="button" data-action="resetFilters" class="min-h-11 rounded-lg border border-gray-300 px-5 py-2.5 font-semibold text-gray-700 transition-colors hover:bg-gray-50">
                        초기화
                    </button>
                </div>
            </div>
        </section>

        <section class="bg-white rounded-xl border border-gray-200 p-5 sm:p-6 lg:col-span-2">
            <div class="mb-4 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
                <div>
                    <h2 class="text-xl font-bold text-gray-900">원생 목록</h2>
                    <p class="mt-1 text-sm text-gray-500" id="kid-summary">총 0명</p>
                </div>
                <div class="flex flex-col gap-2 sm:flex-row">
                    <a href="/kids/new" class="inline-flex min-h-11 items-center justify-center rounded-lg bg-primary-600 px-4 py-2 text-sm font-semibold text-white transition-colors hover:bg-primary-700">
                        원생 추가
                    </a>
                    <button type="button" data-action="loadKids" data-page="1" class="min-h-11 rounded-lg border border-gray-300 px-4 py-2 text-sm font-semibold text-gray-700 transition-colors hover:bg-gray-50">
                        새로고침
                    </button>
                </div>
            </div>

            <div id="kid-list" class="divide-y divide-gray-100" role="region" aria-label="원생 목록" aria-live="polite" aria-busy="true">
                <div class="py-8 text-center text-sm text-gray-500">불러오는 중...</div>
            </div>

            <div class="mt-6 flex items-center justify-between" id="kid-pagination">
                <button type="button" id="kid-prev" data-action="changePage" data-page="1" class="min-h-11 rounded-lg border border-gray-200 px-4 py-2 text-sm font-semibold text-gray-600 transition-colors hover:bg-gray-50">이전</button>
                <div class="text-sm text-gray-500" id="kid-page-indicator">1 / 1</div>
                <button type="button" id="kid-next" data-action="changePage" data-page="1" class="min-h-11 rounded-lg border border-gray-200 px-4 py-2 text-sm font-semibold text-gray-600 transition-colors hover:bg-gray-50">다음</button>
            </div>
        </section>
    </div>
</main>

<!-- HTMX -->
<script th:attr="nonce=${cspNonce}" src="/vendor/htmx.min.js"></script>

<!-- Alpine.js -->
<script th:attr="nonce=${cspNonce}" defer src="/vendor/alpine.min.js"></script>

<!-- SweetAlert2 -->
<script th:attr="nonce=${cspNonce}" src="/vendor/sweetalert2.all.min.js"></script>

<!-- Custom JS (Notifications/UI) -->
<script th:attr="nonce=${cspNonce}" th:src="@{/js/app.js}" src="/js/app.js"></script>

<script th:attr="nonce=${cspNonce}" src="/js/pages/kids.js"></script>
</body>
</html>

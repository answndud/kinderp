<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알림장 작성 - 유치원 ERP</title>

    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}" href="/css/custom.css">
</head>
<body class="bg-gray-50">

<header th:replace="~{fragments/header :: header}"></header>

<main id="notepad-write-page" class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8"
      th:attr="data-kindergarten-id=${currentMember?.kindergartenId}">
    <div class="mb-7">
        <a href="/notepad" class="inline-flex items-center gap-2 text-gray-600 hover:text-primary-600 mb-4">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            목록으로
        </a>
        <p class="mb-2 text-sm font-semibold text-primary-700">알림장 작성</p>
        <h1 class="text-3xl font-bold text-gray-900">알림장 작성</h1>
    </div>

    <div class="rounded-xl border border-gray-200 bg-white">
        <form th:action="@{/notepad}" method="post" class="p-6 space-y-6">
            <div class="grid gap-4">
                <div>
                    <label for="targetType" class="block text-sm font-medium text-gray-700 mb-1">발송 대상</label>
                    <select id="targetType" class="h-11 w-full rounded-lg border border-gray-200 px-4 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
                        <option value="GLOBAL">전체 학부모</option>
                        <option value="CLASSROOM">특정 반</option>
                        <option value="KID">개별 원생</option>
                    </select>
                </div>

                <div>
                    <label for="classroomId" class="block text-sm font-medium text-gray-700 mb-1">반 선택</label>
                    <select id="classroomId" name="classroomId"
                            class="h-11 w-full rounded-lg border border-gray-200 px-4 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
                        <option value="">전체</option>
                    </select>
                </div>

                <div>
                    <label for="kidId" class="block text-sm font-medium text-gray-700 mb-1">원생 선택</label>
                    <select id="kidId" name="kidId"
                            class="h-11 w-full rounded-lg border border-gray-200 px-4 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" disabled>
                        <option value="">원생 선택</option>
                    </select>
                </div>

                <div class="text-xs text-gray-500" id="targetSummary">전체 학부모에게 알림이 발송됩니다.</div>
            </div>

            <div>
                <label for="title" class="block text-sm font-medium text-gray-700 mb-1">제목 *</label>
                <input type="text" name="title" id="title" required
                       class="h-11 w-full rounded-lg border border-gray-200 px-4 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500"
                       placeholder="알림장 제목을 입력하세요" />
            </div>

            <div>
                <label for="content" class="block text-sm font-medium text-gray-700 mb-1">내용 *</label>
                <textarea name="content" id="content" required rows="10"
                          class="w-full rounded-lg border border-gray-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 resize-y"
                          placeholder="알림장 내용을 입력하세요..."></textarea>
            </div>

            <div>
                <label for="photoUrl" class="block text-sm font-medium text-gray-700 mb-1">사진 URL (선택)</label>
                <input type="text" name="photoUrl" id="photoUrl"
                       class="h-11 w-full rounded-lg border border-gray-200 px-4 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500"
                       placeholder="콤마로 구분하여 여러 장을 등록할 수 있습니다" />
            </div>

            <div class="flex gap-3 pt-4 border-t border-gray-200">
                <button type="submit" class="min-h-11 flex-1 rounded-lg bg-primary-600 px-4 py-2 font-semibold text-white transition-colors hover:bg-primary-700">
                    작성하기
                </button>
                <button type="button" data-action="historyBack" class="min-h-11 rounded-lg bg-gray-100 px-4 py-2 font-semibold text-gray-700 transition-colors hover:bg-gray-200">
                    취소
                </button>
            </div>
        </form>
    </div>
</main>

<script th:attr="nonce=${cspNonce}" src="/vendor/htmx.min.js"></script>
<script th:attr="nonce=${cspNonce}" src="/vendor/sweetalert2.all.min.js"></script>
<script th:attr="nonce=${cspNonce}" th:src="@{/js/app.js}"></script>

<script th:attr="nonce=${cspNonce}" th:src="@{/js/pages/notepad-write.js}" src="/js/pages/notepad-write.js"></script>
</body>
</html>

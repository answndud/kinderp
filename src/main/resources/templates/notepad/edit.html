<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알림장 수정 - 유치원 ERP</title>
    <script th:attr="nonce=${cspNonce}" th:src="@{/js/app.js}" src="/js/app.js"></script>

    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}" href="/css/custom.css">
</head>
<body class="bg-gray-50">

<header th:replace="~{fragments/header :: header}"></header>

<main id="notepad-edit-page" data-content-editor class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
    <div class="mb-7">
        <a th:href="@{/notepad/{id}(id=${notepad.id()})}" class="inline-flex items-center gap-2 text-gray-600 hover:text-primary-600 mb-4">
            <span class="text-lg">←</span>
            상세로
        </a>
        <p class="mb-2 text-sm font-semibold text-primary-700">알림장 수정</p>
        <h1 class="text-3xl font-bold text-gray-900">알림장 수정</h1>
    </div>

    <div class="rounded-xl border border-gray-200 bg-white">
        <form th:action="@{/notepad/{id}(id=${notepad.id()})}" method="post" class="p-6 space-y-6">
            <div class="bg-gray-50 rounded-lg p-4 text-sm text-gray-700">
                <div class="flex flex-wrap items-center gap-3">
                    <span class="px-2 py-1 bg-white border border-gray-200 rounded-full" th:text="${notepad.classroomName() != null ? notepad.classroomName() : '전체'}">전체</span>
                    <span class="px-2 py-1 bg-white border border-gray-200 rounded-full" th:if="${notepad.kidName() != null}" th:text="${notepad.kidName()}">원생</span>
                    <span class="text-gray-400">•</span>
                    <span th:text="'작성자: ' + ${notepad.writerName()}">작성자</span>
                </div>
            </div>

            <div>
                <label for="title" class="block text-sm font-medium text-gray-700 mb-1">제목 *</label>
                <input type="text" name="title" id="title" required
                       class="h-11 w-full rounded-lg border border-gray-200 px-4 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500"
                       placeholder="제목을 입력하세요" th:value="${notepad.title()}" />
            </div>

            <div>
                <label for="content" class="block text-sm font-medium text-gray-700 mb-1">내용 *</label>
                <textarea name="content" id="content" required rows="12"
                          class="w-full rounded-lg border border-gray-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 resize-y"
                          placeholder="내용을 입력하세요..." th:text="${notepad.content()}"></textarea>
            </div>

            <div class="flex gap-3 pt-4 border-t border-gray-200">
                <button type="submit" class="min-h-11 flex-1 rounded-lg bg-primary-600 px-4 py-2 font-semibold text-white transition-colors hover:bg-primary-700">
                    수정하기
                </button>
                <button type="button" data-action="navigate" th:attr="data-href=|/notepad/${notepad.id()}|" class="min-h-11 rounded-lg bg-gray-100 px-4 py-2 font-semibold text-gray-700 transition-colors hover:bg-gray-200">
                    취소
                </button>
            </div>
        </form>
    </div>

</main>

<script th:attr="nonce=${cspNonce}" th:src="@{/js/pages/content-editor.js}" src="/js/pages/content-editor.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">유치원 ERP</title>
    
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}" href="/css/custom.css">
</head>
<body class="bg-gray-50">
<header th:replace="~{fragments/header :: header}"></header>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8" th:attr="data-role=${currentMember?.role?.name()}">
        <!-- Page Header -->
        <div class="mb-7 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
            <div>
                <p class="mb-2 text-sm font-semibold text-primary-700">Daily Notes</p>
                <h1 class="text-3xl font-bold text-gray-900">알림장</h1>
                <p class="mt-3 text-gray-600" th:text="${currentMember?.role?.name() == 'PARENT' ? '내 아이에게 전달된 알림장을 먼저 확인하세요.' : '반과 원아별 알림장을 확인하고 필요한 내용을 작성하세요.'}">반과 원아별 알림장을 확인하고 필요한 내용을 작성하세요.</p>
            </div>
            <!-- Create Button (Principal/Teacher only) -->
            <a id="createNotepadBtn" href="/notepad/write" class="hidden min-h-11 items-center justify-center gap-2 rounded-lg bg-primary-600 px-4 py-2 text-sm font-semibold text-white transition-colors hover:bg-primary-700">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                알림장 작성
            </a>
        </div>


        <!-- Filter -->
        <div class="mb-6 rounded-xl border border-gray-200 bg-white p-4">
            <div class="grid gap-4 sm:grid-cols-2">
                <div>
                    <label for="filterClassroom" class="mb-1.5 block text-xs font-semibold text-gray-600">반</label>
                    <select id="filterClassroom" name="classroomId" class="h-11 w-full rounded-lg border border-gray-200 px-4 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
                    <option value="">전체 반</option>
                    </select>
                </div>
                <div>
                    <label for="filterKid" class="mb-1.5 block text-xs font-semibold text-gray-600">원생</label>
                    <select id="filterKid" name="kidId" disabled class="h-11 w-full rounded-lg border border-gray-200 px-4 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
                    <option value="">전체 원생</option>
                    </select>
                </div>
            </div>
            <p id="notepadStatus" class="mt-3 text-sm text-gray-500" role="status" aria-live="polite">알림장을 불러오는 중입니다.</p>
        </div>

        <!-- Notepad List Container (HTMX) -->
        <div id="notepad-list"
             hx-get="/notepad/list"
             hx-trigger="load, filters-changed from:body"
             hx-include="#filterClassroom,#filterKid"
             hx-swap="outerHTML"
             class="space-y-4"
             role="region"
             aria-label="알림장 목록"
             aria-live="polite"
             aria-busy="true">
            <div class="flex justify-center items-center py-12">
                <svg class="animate-spin h-8 w-8 text-primary-600" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </div>
        </div>
    </main>

    <!-- HTMX -->
    <script th:attr="nonce=${cspNonce}" src="/vendor/htmx.min.js"></script>

    <!-- Alpine.js -->
    <script th:attr="nonce=${cspNonce}" defer src="/vendor/alpine.min.js"></script>

    <!-- SweetAlert2 -->
    <script th:attr="nonce=${cspNonce}" src="/vendor/sweetalert2.all.min.js"></script>

    <!-- Custom JS (UI/Notifications) -->
    <script th:attr="nonce=${cspNonce}" th:src="@{/js/app.js}"></script>

    <script th:attr="nonce=${cspNonce}" th:src="@{/js/pages/notepad-list.js}" src="/js/pages/notepad-list.js"></script>
</body>
</html>

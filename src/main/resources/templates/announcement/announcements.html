<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">유치원 ERP</title>
    
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}" href="/css/custom.css">
</head>
<body class="bg-gray-50">
<header th:replace="~{fragments/header :: header}"></header>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
        <!-- Page Header -->
        <div class="mb-7 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
            <div>
                <p class="mb-2 text-sm font-semibold text-primary-700">Notice Board</p>
                <h1 class="text-3xl font-bold text-gray-900">공지사항</h1>
                <p class="mt-3 text-gray-600">유치원 소식과 중요 공지를 빠르게 확인하세요.</p>
            </div>
            <!-- Create Button (Principal/Teacher only) -->
            <a th:if="${currentMember != null}"
               href="/announcement/write"
               class="inline-flex min-h-11 items-center justify-center gap-2 rounded-lg bg-primary-600 px-4 py-2 text-sm font-semibold text-white transition-colors hover:bg-primary-700">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                공지사항 작성
            </a>
        </div>

        <!-- Filter -->
        <div class="mb-6 rounded-xl border border-gray-200 bg-white p-3">
            <div class="flex gap-2">
                <button type="button" id="allBtn" class="min-h-11 rounded-lg bg-primary-100 px-4 py-2 font-semibold text-primary-700 transition-colors"
                        hx-get="/announcements/list?importantOnly=false"
                        hx-target="#announcement-list"
                        hx-swap="outerHTML"
                        aria-pressed="true">
                    전체
                </button>
                <button type="button" id="importantBtn" class="min-h-11 rounded-lg bg-yellow-50 px-4 py-2 font-semibold text-yellow-800 transition-colors hover:bg-yellow-100"
                        hx-get="/announcements/list?importantOnly=true"
                        hx-target="#announcement-list"
                        hx-swap="outerHTML"
                        aria-pressed="false">
                    중요 공지
                </button>
            </div>
        </div>

        <!-- Announcement List Container (HTMX) -->
        <div id="announcement-list"
             hx-get="/announcements/list?importantOnly=false"
             hx-trigger="load"
             class="space-y-4"
             role="region"
             aria-label="공지사항 목록"
             aria-live="polite"
             aria-busy="true">
            <!-- Loading spinner -->
            <div class="flex justify-center items-center py-12">
                <svg class="animate-spin h-8 w-8 text-primary-600" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </div>
        </div>
    </main>

    <!-- HTMX -->
    <script th:attr="nonce=${cspNonce}" src="/vendor/htmx.min.js"></script>
    <script th:attr="nonce=${cspNonce}" th:src="@{/js/app.js}" src="/js/app.js"></script>

    <script th:attr="nonce=${cspNonce}" th:src="@{/js/pages/announcement-list.js}" src="/js/pages/announcement-list.js"></script>
</body>
</html>

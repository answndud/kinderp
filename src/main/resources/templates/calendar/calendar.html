<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일정/캘린더 - 유치원 ERP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}" href="/css/custom.css">
</head>
<body class="bg-gray-50">

<header th:replace="~{fragments/header :: header}"></header>

<main id="calendar-page"
      th:attr="data-role=${currentMember?.role?.name()},data-member-id=${currentMember?.id},data-kindergarten-id=${currentMember?.kindergartenId}">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
        <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between mb-8">
            <div>
                <p class="mb-2 text-sm font-semibold text-primary-700">일정 관리</p>
                <h1 class="text-3xl font-bold text-gray-900">일정/캘린더</h1>
                <p class="mt-3 text-gray-600">유치원, 반, 개인 일정을 한곳에서 관리하세요.</p>
            </div>
            <button type="button" id="createEventBtn"
                    class="inline-flex min-h-11 items-center justify-center gap-2 rounded-lg bg-primary-600 px-5 py-2.5 font-semibold text-white transition-colors hover:bg-primary-700">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                새 일정
            </button>
        </div>

        <div class="mb-6 rounded-xl border border-gray-200 bg-white p-5">
            <div class="grid grid-cols-1 lg:grid-cols-5 gap-4">
                <div class="lg:col-span-2">
                    <span class="block text-sm font-semibold text-gray-600 mb-2">조회 기간</span>
                    <div class="flex gap-2">
                        <label for="startDate" class="sr-only">조회 시작일</label>
                        <input type="date" id="startDate" name="startDate" aria-label="조회 시작일" class="h-11 w-full rounded-lg border border-gray-200 px-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
                        <label for="endDate" class="sr-only">조회 종료일</label>
                        <input type="date" id="endDate" name="endDate" aria-label="조회 종료일" class="h-11 w-full rounded-lg border border-gray-200 px-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
                    </div>
                </div>
                <div>
                    <label for="scopeType" class="block text-sm font-semibold text-gray-600 mb-2">범위</label>
                    <select id="scopeType" name="scopeType" aria-label="일정 범위" class="h-11 w-full rounded-lg border border-gray-200 px-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
                        <option value="">전체</option>
                        <option th:each="scope : ${scopeTypes}" th:value="${scope.name()}" th:text="${scope.name()}"></option>
                    </select>
                </div>
                <div>
                    <label for="classroomId" class="block text-sm font-semibold text-gray-600 mb-2">반</label>
                    <select id="classroomId" name="classroomId" aria-label="조회할 반" class="h-11 w-full rounded-lg border border-gray-200 px-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" disabled>
                        <option value="">전체</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button type="button" id="todayBtn" class="min-h-11 w-full rounded-lg border border-gray-200 px-4 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-50">오늘</button>
                </div>
            </div>
        </div>

        <div id="calendar-list"
             hx-get="/calendar/list"
             hx-trigger="calendar-filters-changed from:body"
             hx-include="#startDate,#endDate,#scopeType,#classroomId"
             hx-swap="outerHTML"
             class="space-y-4"
             role="region"
             aria-label="일정 목록"
             aria-live="polite"
             aria-busy="true">
            <div class="flex justify-center items-center py-16">
                <svg class="animate-spin h-8 w-8 text-primary-600" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </div>
        </div>
    </div>
</main>

<!-- HTMX -->
<script th:attr="nonce=${cspNonce}" src="/vendor/htmx.min.js"></script>

<!-- Alpine.js -->
<script th:attr="nonce=${cspNonce}" defer src="/vendor/alpine.min.js"></script>

<!-- SweetAlert2 -->
<script th:attr="nonce=${cspNonce}" src="/vendor/sweetalert2.all.min.js"></script>

<!-- Custom JS -->
<script th:attr="nonce=${cspNonce}" th:src="@{/js/app.js}"></script>

<script th:attr="nonce=${cspNonce}" th:src="@{/js/pages/calendar-page.js}" src="/js/pages/calendar-page.js"></script>
</body>
</html>

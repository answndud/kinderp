spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: false

  flyway:
    enabled: true

  data:
    redis:
      repositories:
        enabled: false
      database: 0
      timeout: 3000

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope:
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          kakao:
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
            provider: kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# JWT Configuration
jwt:
  secret: test-secret-key-for-testing-purpose-only-must-be-at-least-256-bits-long-for-jwt-token-generation-and-validation
  access-token-validity: 900000    # 15 minutes
  refresh-token-validity: 604800000 # 7 days
  cookie-secure: false

# Logging
logging:
  level:
    com.kinderp: INFO
    org.springframework.security: INFO
    org.springframework.test.web.servlet: INFO
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO

notification:
  delivery:
    worker-enabled: false
    rate-limit:
      user-limit: 2
      ip-limit: 3
    push:
      signature-secret: test-push-webhook-secret
    app:
      signature-secret: test-app-webhook-secret
    incident-webhook:
      signature-secret: test-incident-webhook-secret

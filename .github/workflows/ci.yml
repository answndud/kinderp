name: Backend CI

on:
  push:
    branches:
      - main
      - develop
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-check:
    name: Quick Check
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run frontend:build

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Check template accessibility contracts
        run: npm run accessibility:templates

      - name: Check current documentation links
        run: npm run docs:links

      - name: Check view error message contracts
        run: npm run security:view-errors

      - name: Check CSP-compatible event contracts
        run: npm run security:inline-handlers

      - name: Run fast test suite
        run: ./gradlew --no-daemon fastTest

      - name: Build bootJar artifact
        run: ./gradlew --no-daemon bootJar

      - name: Resolve compose config
        run: |
          docker compose --env-file docker/.env.example -f docker/docker-compose.yml config >/tmp/docker-compose.base.yml
          PROD_ENV_FILE=.env.prod.example docker compose --env-file deploy/.env.prod.example -f deploy/docker-compose.prod.yml config >/tmp/docker-compose.prod.yml
          docker run --rm -e APP_DOMAIN=erp.example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile

      - name: Validate operational shell scripts
        run: bash -n scripts/deploy-with-rollback.sh scripts/backup-production.sh scripts/verify-production-backup.sh scripts/restore-production-backup.sh

      - name: Validate deployment preflight
        run: |
          PREFLIGHT_ONLY=1 \
          PROD_ENV_FILE=.env.prod.example \
          COMPOSE_ENV_FILE=deploy/.env.prod.example \
          COMPOSE_FILE=deploy/docker-compose.prod.yml \
          ./scripts/deploy-with-rollback.sh

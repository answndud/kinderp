groups:
  - name: kinderp-availability
    rules:
      - alert: KindergartenErpReadinessDown
        expr: max_over_time(up{job="kinderp"}[2m]) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: KinderP metrics target is unavailable
          description: Prometheus cannot scrape the application metrics endpoint for more than two minutes.

      - alert: KindergartenErpHttp5xxRateHigh
        expr: sum(rate(http_server_requests_seconds_count{job="kinderp",status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job="kinderp"}[5m])), 1) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: KinderP HTTP 5xx rate is above 5 percent
          description: The application has returned more than five percent HTTP 5xx responses during the last ten minutes.

      - alert: KindergartenErpNotificationDeadLetters
        expr: sum(increase(notification_delivery_attempts_total{job="kinderp",outcome="dead_letter"}[15m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Notification outbox dead-letter detected
          description: At least one notification delivery entered dead-letter during the last fifteen minutes.
